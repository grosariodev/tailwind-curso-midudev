<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gabi.links - Enlaces de redes sociales</title>
    
    <meta name="theme-color" content="#000000">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style>
        html.lenis, html.lenis body {
          height: auto;
        }
        .lenis.lenis-smooth {
          scroll-behavior: auto !important;
        }
        .lenis.lenis-smooth [data-lenis-prevent] {
          overscroll-behavior: contain;
        }
        .lenis.lenis-stopped {
          overflow: hidden;
        }
        .lenis.lenis-scrolling iframe {
          pointer-events: none;
        }
    </style>
</head>

<body class="bg-black bg-[radial-gradient(ellipse_at_top,_rgba(29,78,216,0.3)_0%,transparent_80%)] bg-no-repeat min-h-screen antialiased">

    <main class="max-w-xl mx-auto px-6">
        <header class="text-white">
            <img src="./assets/gabifotorecorte.png" alt="gabi sonriendo"
                class="h-100 object-cover block mx-auto mt-12 -mb-12 [mask-image:linear-gradient(to_bottom,black_60%,transparent)]">

            <div class="flex flex-col justify-center items-center">
                <span class="text-xs font-mono px-3 py-1 border border-white/20 rounded-full text-gray-300 flex items-center bg-white/5 backdrop-blur-sm cursor-crosshair">
                    @gabrieldev
                    <svg class="ml-1.5 w-4 h-4 text-sky-400 inline" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707a1 1 0 00-1.414-1.414L9 11.172l-1.293-1.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                    </svg>
                </span>

                <h1 class="text-4xl md:text-6xl text-center font-semibold mt-5 bg-gradient-to-r from-white to-[#748298] text-transparent bg-clip-text pb-4">
                    Gabriel Eduardo <br>Rosario Alvarado
                </h1>
            </div>

            <section class="flex gap-3 justify-center mb-12">
                <a class="bg-gradient-to-br from-purple-600 via-pink-500 to-orange-400 p-2 size-12 flex items-center justify-center rounded-full hover:scale-110 transition-transform" href="#">
                    <svg width="28" height="28"><use xlink:href="./assets/sprite.svg#instagram"></use></svg>
                </a>
                <a class="bg-white p-2 size-12 flex items-center justify-center rounded-full hover:scale-110 transition-transform" href="#">
                    <svg width="28" height="28"><use xlink:href="./assets/sprite.svg#linkedin"></use></svg>
                </a>
                <a class="bg-gray-800 p-2 size-12 flex items-center justify-center rounded-full hover:scale-110 transition-transform" href="#">
                    <svg width="28" height="28"><use xlink:href="./assets/sprite.svg#github"></use></svg>
                </a>
            </section>
        </header>

        <div class="h-[100vh]"></div>
    </main>

    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
    <script>
        const lenis = new Lenis({
            duration: 1.2, // Qué tan lento/suave es el scroll
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), // La curva de suavizado tipo Framer
            smoothWheel: true,
            touchMultiplier: 1.5, // Hace que en el iPhone se sienta más responsivo
        })

        function raf(time) {
            lenis.raf(time)
            requestAnimationFrame(raf)
        }

        requestAnimationFrame(raf)
    </script>
</body>
</html>
